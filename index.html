<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solar Explorer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🪐%3C/text%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.27.0/plotly-basic.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🌌 Solar Explorer</h1>
  <p>태양계 데이터로 탐구하는 인터랙티브 물리 · 수학 웹 서비스</p>
</header>
<nav id="tabs">
  <button data-t="explore" class="active">🪐 행성 탐색</button>
  <button data-t="compare">📊 데이터 비교</button>
  <button data-t="calc">🧮 물리량 계산</button>
  <button data-t="kepler">🔬 케플러 법칙</button>
  <button data-t="sim">🛠 가상 행성</button>
</nav>
<main>

<section id="explore" class="panel active">
  <div class="card" style="text-align:center;padding:8px">
    <div class="speedbar" id="speedBar"></div>
    <div id="systemDiagram"></div>
    <div class="zoombar"><button onclick="resetZoom()">🔭 전체보기</button></div>
    <p class="muted" id="diagramNote">거리 비율은 실제 AU 기준 축척 (행성 크기는 보기 쉽게 과장됨) · 아래 버튼을 누르면 해당 행성으로 확대</p>
  </div>
  <div class="planet-grid" id="explorePlanets"></div>
  <div class="belt-grid" id="beltButtons"></div>
  <div class="card" id="exploreCard"></div>
</section>

<section id="compare" class="panel">
  <div class="card">
    <div class="row">
      <div><label>X축 변수</label><select id="xVar"></select></div>
      <div><label>Y축 변수</label><select id="yVar"></select></div>
    </div>
    <div id="compareChart" class="chart"></div>
  </div>
</section>

<section id="calc" class="panel">
  <div class="card">
    <label>행성 선택</label>
    <select id="calcPlanet"></select>
    <div class="formula">g = GM / R<sup>2</sup></div>
    <div class="formula">v<sub>e</sub> = √(2GM / R)</div>
    <div id="calcResult"></div>
  </div>
</section>

<section id="kepler" class="panel">
  <div class="card">
    <div class="formula">T<sup>2</sup> ∝ a<sup>3</sup> &nbsp;(a: AU, T: 년)</div>
    <div id="keplerChart" class="chart"></div>
    <table id="keplerTable"></table>
  </div>
</section>

<section id="sim" class="panel">
  <div class="card">
    <div class="row">
      <div><label>질량 (지구=1)</label><input id="simMass" type="number" value="2.0" step="0.1"></div>
      <div><label>반지름 (지구=1)</label><input id="simRadius" type="number" value="1.5" step="0.1"></div>
      <div><label>태양거리 (AU)</label><input id="simDist" type="number" value="2.0" step="0.1"></div>
    </div>
    <button class="run" onclick="runSim(true)">계산하기</button>
    <div id="simResult" style="margin-top:12px"></div>
  </div>
</section>

</main>

<script src="script.js"></script>
</body>
</html>
